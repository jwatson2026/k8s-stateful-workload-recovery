apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateful-workload
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stateful-workload
  template:
    metadata:
      labels:
        app: stateful-workload
    spec:
      containers:
        - name: storage-app
          image: busybox:1.36
          command:
            - sh
            - -c
            - "sleep 360000"
          volumeMounts:
            - name: persistent-data
              mountPath: /data
      volumes:
        - name: persistent-data
          persistentVolumeClaim:
            claimName: workload-data